# Once a week, judges the collected candidates against the reader's interests
# and records the picks. A scheduled run publishes them; a manual run stores a
# draft unless "publish" is ticked.
name: Weekly picks

on:
  schedule:
    - cron: "30 9 * * 6" # Saturdays 09:30 UTC (06:30 in Brasília), after the daily collection
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the picks to everyone"
        type: boolean
        default: false
      test:
        description: "Test only: read two articles and store nothing"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: judge
  cancel-in-progress: false

jobs:
  judge:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: curation
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: curation/package-lock.json
      - run: npm ci
      - run: node judge.mjs
        env:
          COLLECTOR_TOKEN: ${{ secrets.COLLECTOR_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PUBLISH: ${{ github.event_name == 'schedule' || inputs.publish == true }}
          TEST: ${{ inputs.test == true }}
