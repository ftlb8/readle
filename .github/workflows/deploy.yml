# Builds Readle and publishes it to GitHub Pages on every push to main.
name: Deploy

on:
  push:
    branches: [main]
    # Changes that do not affect the website do not need a new deployment.
    paths-ignore:
      - "extension/**"
      - "supabase/**"
      - "README.md"
      - "curation/**"
      - ".github/workflows/keep-awake.yml"
      - ".github/workflows/collect.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # A separate job, so the uploaded site is fully registered before publishing.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
